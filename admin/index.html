<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karvandor Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sidebar-bg:#111111;
  --sidebar-w:240px;
  --main-bg:#F4F5F7;
  --card-bg:#ffffff;
  --border:#E4E4E7;
  --text:#111111;
  --text-secondary:#6B7280;
  --accent:#111111;
  --active-bg:#F4F5F7;
  --yellow:#F59E0B;
  --green:#059669;
  --red:#DC2626;
  --blue:#2563EB;
  --radius:18px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--main-bg);display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:var(--sidebar-bg);
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
  position:relative;z-index:10;
}
.sidebar-logo{
  padding:20px 16px 12px;
  border-bottom:1px solid #2a2a2a;
}
.logo-row{display:flex;align-items:center;gap:10px}
.logo-img{
  width:36px;height:36px;border-radius:10px;
  background:#fff;display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
}
.logo-img img{width:100%;height:100%;object-fit:cover}
.logo-img-placeholder{font-size:16px;font-weight:700;color:#111}
.company-name{color:#fff;font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.company-plan{color:#9CA3AF;font-size:11px}

.sidebar-menu{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:none}
.sidebar-menu::-webkit-scrollbar{display:none}

.menu-section{padding:4px 12px 2px;color:#6B7280;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-top:8px}

.menu-btn{
  position:relative;
  display:flex;align-items:center;gap:10px;
  width:100%;padding:9px 16px;
  background:transparent;border:none;
  color:#9CA3AF;font-size:13px;font-weight:500;
  cursor:pointer;text-align:left;
  transition:color .15s;
}
.menu-btn:hover{color:#fff}
.menu-btn .menu-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.menu-btn .menu-label{flex:1}
.menu-btn .menu-badge{
  background:#DC2626;color:#fff;font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;
}
/* Active state — siyoh background, oq content */
.menu-btn.is-active{
  color:#111111;background:#F4F5F7;
  border-radius:12px 0 0 12px;
  margin-right:0;
}
.menu-btn.is-active::before,
.menu-btn.is-active::after{
  content:'';position:absolute;right:0;width:12px;height:12px;
  background:#111111;
}
.menu-btn.is-active::before{top:-12px;border-bottom-right-radius:12px;box-shadow:5px 5px 0 5px #F4F5F7}
.menu-btn.is-active::after{bottom:-12px;border-top-right-radius:12px;box-shadow:5px -5px 0 5px #F4F5F7}

.sidebar-bottom{padding:12px 16px;border-top:1px solid #2a2a2a}
.user-row{display:flex;align-items:center;gap:10px}
.user-avatar{
  width:32px;height:32px;border-radius:50%;
  background:#374151;display:flex;align-items:center;justify-content:center;
  color:#9CA3AF;font-size:13px;font-weight:600;flex-shrink:0;
}
.user-info{flex:1;min-width:0}
.user-name{color:#fff;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{color:#6B7280;font-size:11px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 12px 12px 0}
.main-inner{flex:1;background:#F4F5F7;border-radius:26px;display:flex;flex-direction:column;overflow:hidden}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;border-bottom:1px solid var(--border);
  background:var(--card-bg);border-radius:26px 26px 0 0;
  flex-shrink:0;
}
.topbar-title{font-size:16px;font-weight:700;color:var(--text);flex:1}
.search-wrap{position:relative}
.search-input{
  padding:7px 12px 7px 34px;border:1px solid var(--border);
  border-radius:10px;font-size:13px;width:220px;
  background:#F9FAFB;outline:none;color:var(--text);
}
.search-input:focus{border-color:#111;background:#fff}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9CA3AF;font-size:14px}
.topbar-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--card-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;position:relative;transition:background .15s;
}
.icon-btn:hover{background:#F3F4F6}
.notif-dot{
  position:absolute;top:5px;right:5px;width:7px;height:7px;
  border-radius:50%;background:#DC2626;border:1px solid #fff;
}
.role-select{
  padding:6px 10px;border:1px solid var(--border);border-radius:10px;
  font-size:13px;background:var(--card-bg);color:var(--text);cursor:pointer;outline:none;
}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:20px;scrollbar-width:thin;scrollbar-color:#E4E4E7 transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:#E4E4E7;border-radius:4px}

/* CARDS */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-sm{padding:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* STAT CARD */
.stat-card{
  background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;display:flex;flex-direction:column;gap:4px;
}
.stat-label{font-size:12px;color:var(--text-secondary);font-weight:500}
.stat-value{font-size:26px;font-weight:800;color:var(--text);line-height:1.1}
.stat-sub{font-size:12px;color:var(--text-secondary)}
.stat-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px}
.badge-green{background:#D1FAE5;color:#059669}
.badge-yellow{background:#FEF3C7;color:#D97706}
.badge-red{background:#FEE2E2;color:#DC2626}
.badge-blue{background:#DBEAFE;color:#2563EB}
.badge-gray{background:#F3F4F6;color:#6B7280}

/* SECTION HEADING */
.section-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.section-title .title-btn{font-size:12px;font-weight:600;color:#2563EB;cursor:pointer;background:none;border:none}

/* DRIVER CARD */
.driver-card{
  border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;
  background:#fff;cursor:pointer;transition:border-color .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.driver-card:hover{border-color:#111;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.driver-card.smart-alert{
  border-color:var(--yellow)!important;
  background:linear-gradient(135deg,#FFFBEB 0%,#fff 60%);
  box-shadow:0 0 0 3px #FEF3C7;
  animation:pulse-yellow 2s infinite;
}
@keyframes pulse-yellow{0%,100%{box-shadow:0 0 0 3px #FEF3C7}50%{box-shadow:0 0 0 6px #FDE68A}}
.driver-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.driver-avatar{
  width:38px;height:38px;border-radius:50%;background:#F3F4F6;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;
}
.driver-info{flex:1;min-width:0}
.driver-name{font-size:13px;font-weight:700;color:var(--text)}
.driver-phone{font-size:11px;color:var(--text-secondary)}
.driver-status-row{display:flex;align-items:center;gap:6px;margin-top:3px}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.status-dot.free{background:#059669}
.status-dot.on-trip{background:#2563EB}
.status-dot.yellow{background:#F59E0B}
.driver-trip-info{font-size:11px;color:var(--text-secondary);background:#F9FAFB;border-radius:8px;padding:6px 10px;margin-top:6px}
.driver-trip-route{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.driver-trip-progress{margin-top:6px}
.trip-bar{height:4px;background:#E4E4E7;border-radius:2px;overflow:hidden}
.trip-bar-fill{height:100%;border-radius:2px;background:#2563EB;transition:width .5s}

/* SMART MATCH SECTION */
.smart-match-section{
  margin-top:10px;padding:10px 12px;
  background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;
}
.smart-match-title{font-size:11px;font-weight:700;color:#92400E;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.match-listing{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:#fff;border:1px solid #FDE68A;border-radius:8px;margin-bottom:6px;cursor:pointer;
  transition:border-color .15s;
}
.match-listing:hover{border-color:#F59E0B}
.match-listing-route{font-size:12px;font-weight:600;color:var(--text);flex:1}
.match-listing-price{font-size:11px;font-weight:700;color:#059669}
.match-listing-cargo{font-size:10px;color:var(--text-secondary)}
.smart-match-actions{display:flex;gap:6px;margin-top:6px}
.sm-btn{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;border:none}
.sm-btn-dismiss{background:#F3F4F6;color:#6B7280}
.sm-btn-dismiss:hover{background:#E5E7EB}

/* ORDER ROW */
.order-row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  border:1px solid var(--border);border-radius:12px;
  background:#fff;margin-bottom:8px;cursor:pointer;
  transition:border-color .15s;
}
.order-row:hover{border-color:#111}
.order-id{font-size:11px;font-weight:700;color:var(--text-secondary);min-width:60px}
.order-route{font-size:13px;font-weight:600;color:var(--text);flex:1}
.order-cargo{font-size:11px;color:var(--text-secondary)}
.order-price{font-size:13px;font-weight:700;color:var(--text)}

/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:11px;font-weight:600;color:var(--text-secondary);text-align:left;padding:8px 12px;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.5px}
.data-table td{font-size:13px;padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text)}
.data-table tr:last-child td{border-bottom:none}
.data-table tbody tr:hover{background:#F9FAFB}

/* LISTING CARD */
.listing-card{
  border:1px solid var(--border);border-radius:12px;padding:14px 16px;
  background:#fff;margin-bottom:8px;
}
.listing-route{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.listing-meta{display:flex;gap:12px;font-size:11px;color:var(--text-secondary)}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;
  cursor:pointer;border:none;transition:all .15s;
}
.btn-primary{background:#111;color:#fff}
.btn-primary:hover{background:#333}
.btn-secondary{background:#F3F4F6;color:#111;border:1px solid var(--border)}
.btn-secondary:hover{background:#E5E7EB}
.btn-danger{background:#FEE2E2;color:#DC2626}
.btn-danger:hover{background:#FECACA}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:7px}

/* MODAL */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:#fff;border-radius:20px;padding:28px;
  width:520px;max-width:95vw;max-height:85vh;overflow-y:auto;
  transform:translateY(20px);transition:transform .2s;
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.modal-close{font-size:20px;cursor:pointer;color:var(--text-secondary);background:none;border:none;line-height:1}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px}
.form-input{
  width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;
  font-size:13px;color:var(--text);outline:none;background:#fff;
}
.form-input:focus{border-color:#111}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-select{appearance:none}

/* DOC STATUS */
.doc-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.doc-name{font-size:12px;font-weight:600;color:var(--text);flex:1}
.doc-expiry{font-size:11px;color:var(--text-secondary)}
.doc-upload-btn{font-size:11px;color:#2563EB;cursor:pointer;background:none;border:none;font-weight:600}

/* NOTIFICATIONS */
.notif-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.notif-item:last-child{border-bottom:none}
.notif-dot-big{width:8px;height:8px;border-radius:50%;background:#2563EB;margin-top:5px;flex-shrink:0}
.notif-text{font-size:13px;color:var(--text);flex:1}
.notif-time{font-size:11px;color:var(--text-secondary);margin-top:2px}

/* TRIP PROGRESS */
.trip-timeline{padding:12px 0}
.timeline-item{display:flex;gap:12px;margin-bottom:12px}
.timeline-dot{width:10px;height:10px;border-radius:50%;background:#111;margin-top:4px;flex-shrink:0}
.timeline-line{width:2px;background:#E4E4E7;margin:14px 4px 0;flex-shrink:0}
.timeline-label{font-size:12px;font-weight:600;color:var(--text)}
.timeline-sub{font-size:11px;color:var(--text-secondary)}

/* MAP PLACEHOLDER */
.map-placeholder{
  background:#F9FAFB;border:1px solid var(--border);border-radius:14px;
  height:400px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;color:var(--text-secondary);
}

/* SETTINGS SECTION */
.settings-block{padding:20px;border:1px solid var(--border);border-radius:14px;background:#fff;margin-bottom:16px}
.settings-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F3F4F6}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:13px;color:var(--text)}
.toggle{position:relative;width:40px;height:22px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;background:#E4E4E7;border-radius:11px;cursor:pointer;transition:.3s;
}
.toggle-slider::before{
  content:'';position:absolute;width:16px;height:16px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:.3s;
}
.toggle input:checked+.toggle-slider{background:#111}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}

/* COLOR PICKER */
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-swatch{
  width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform .15s;
}
.color-swatch:hover,.color-swatch.selected{transform:scale(1.15);border-color:#fff;box-shadow:0 0 0 2px #111}

/* LOGO UPLOAD */
.logo-upload{
  display:flex;align-items:center;gap:14px;padding:14px;
  border:2px dashed var(--border);border-radius:12px;cursor:pointer;
  transition:border-color .15s;
}
.logo-upload:hover{border-color:#111}
.logo-preview{width:52px;height:52px;border-radius:12px;background:#F3F4F6;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px}
.logo-preview img{width:100%;height:100%;object-fit:cover}
.logo-upload-text{font-size:13px;color:var(--text-secondary)}
.logo-upload-hint{font-size:11px;color:#9CA3AF;margin-top:2px}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-secondary)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.empty-sub{font-size:13px}

/* SCROLL */
.scroll-x{overflow-x:auto;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}

/* REPORT CHART PLACEHOLDER */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:8px;height:120px;padding:0 4px}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar{width:100%;border-radius:6px 6px 0 0;background:#111;min-height:4px;transition:height .4s}
.chart-label{font-size:10px;color:var(--text-secondary)}

/* RATING STARS */
.stars{color:#F59E0B;font-size:12px;letter-spacing:1px}

/* TOAST */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:#111;color:#fff;padding:12px 20px;border-radius:12px;
  font-size:13px;font-weight:500;z-index:999;
  transform:translateY(60px);opacity:0;transition:.3s;pointer-events:none;
  max-width:320px;
}
.toast.show{transform:translateY(0);opacity:1}

/* SECTION TABS */
.tabs{display:flex;gap:2px;background:#F3F4F6;border-radius:10px;padding:3px;margin-bottom:16px}
.tab{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-secondary);border:none;background:transparent;transition:.15s}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}

.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}.mb-2{margin-bottom:8px}
.mt-3{margin-top:12px}.mt-2{margin-top:8px}.fw-700{font-weight:700}.text-sm{font-size:12px}.text-xs{font-size:11px}
.text-secondary{color:var(--text-secondary)}.w-full{width:100%}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-row">
      <div class="logo-img" id="logo-img">
        <div class="logo-img-placeholder" id="logo-placeholder">N</div>
      </div>
      <div>
        <div class="company-name" id="company-name-display">Navoiy Trans</div>
        <div class="company-plan">Pro tarif</div>
      </div>
    </div>
  </div>

  <div class="sidebar-menu" id="sidebar-menu">
    <!-- Dispatcher -->
    <div id="menu-dispatcher" style="display:none"></div>
    <!-- Manager -->
    <div id="menu-manager" style="display:none"></div>
    <!-- Superadmin -->
    <div id="menu-superadmin" style="display:none"></div>
  </div>

  <div class="sidebar-bottom">
    <div class="user-row">
      <div class="user-avatar" id="user-avatar">D</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Dispatcher</div>
        <div class="user-role" id="user-role-label">Dispecher</div>
      </div>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="main-inner">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Boshqaruv paneli</div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" placeholder="Qidirish..." id="search-input">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="network-btn" title="Tarmoq holati">🟢</button>
        <button class="icon-btn" onclick="toggleNotifPanel()" title="Bildirishnomalar">
          🔔
          <span class="notif-dot" id="notif-dot" style="display:none"></span>
        </button>
        <select class="role-select" id="role-select" onchange="switchRole(this.value)">
          <option value="dispatcher">Dispecher</option>
          <option value="manager">Menejer</option>
          <option value="superadmin">Superadmin</option>
        </select>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content" id="main-content"></div>
  </div>
</div>

<!-- NOTIFICATIONS PANEL -->
<div id="notif-panel" style="position:fixed;top:60px;right:12px;width:320px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50;display:none;max-height:400px;overflow-y:auto">
  <div style="padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center">
    Bildirishnomalar
    <button onclick="markAllRead()" style="font-size:11px;color:#2563EB;background:none;border:none;cursor:pointer;font-weight:600">Hammasini o'qi</button>
  </div>
  <div id="notif-list"></div>
</div>

<!-- MODAL: Order detail -->
<div class="modal-overlay" id="order-modal">

function deepMerge(t,s){
  if(!s||typeof s!=='object')return t;
  for(const k of Object.keys(s)){
    if(Array.isArray(s[k]))t[k]=s[k];
    else if(s[k]&&typeof s[k]==='object')t[k]=deepMerge(t[k]||{},s[k]);
    else t[k]=s[k];

}

function fmoney(n){return new Intl.NumberFormat('uz-UZ').format(n)+" so'm";}
function ftime(ts){return new Date(ts).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'});}
function fdate(ts){return new Date(ts).toLocaleDateString('uz-UZ');}
function timeAgo(ts){const d=Date.now()-ts;if(d<60000)return'Hozir';if(d<3600000)return Math.floor(d/60000)+' daq oldin';if(d<86400000)return Math.floor(d/3600000)+' soat oldin';return fdate(ts);}
function docStatus(exp){if(!exp)return'missing';const d=Math.ceil((new Date(exp)-new Date())/86400000);if(d<0)return'expired';if(d<=30)return'warning';return'ok';}
function docColor(exp){return{ok:'#059669',warning:'#D97706',expired:'#DC2626',missing:'#9CA3AF'}[docStatus(exp)];}
function docIcon(exp){return{ok:'✅',warning:'⚠️',expired:'🔴',missing:'⬜'}[docStatus(exp)];}
function carLabel(t){return CAR_TYPES.find(c=>c.v===t)?.l||t;}
function statusBadge(s){
  const m={pending:{label:'Kutilmoqda',cls:'badge-yellow'},on-road:{label:'Yo\'lda',cls:'badge-blue'},delivered:{label:'Yetkazildi',cls:'badge-green'},cancelled:{label:'Bekor',cls:'badge-red'}};
  const r=m[s]||{label:s,cls:'badge-gray'};
  return`<span class="stat-badge ${r.cls}">${r.label}</span>`;
}
function driverStatusBadge(s){
  if(s==='free')return`<span class="stat-badge badge-green">Bo'sh</span>`;
  if(s==='on-trip')return`<span class="stat-badge badge-blue">Yo'lda</span>`;
  return`<span class="stat-badge badge-gray">${s}</span>`;
}
function calcPrice(from,to,weight,carType){
  const dist=DISTANCES[`${from}-${to}`]||DISTANCES[`${to}-${from}`]||400;
  return Math.round(dist*(CAR_RATE[carType]||1000)*Math.max(1,weight/10));
}
function calcHours(from,to){
  const dist=DISTANCES[`${from}-${to}`]||DISTANCES[`${to}-${from}`]||400;
  return Math.round((dist/80)*10)/10;
}
function tripProgress(driver){
  if(!driver.currentTrip)return 0;
  const elapsed=Date.now()-driver.currentTrip.startedAt;
  const total=driver.currentTrip.estimatedHours*3600000;
  return Math.min(100,Math.round(elapsed/total*100));
}
function toast(msg,ms=2500){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}
function genId(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);}

function renderSidebar(){

  const roleLabels={dispatcher:'Dispecher',manager:'Menejer',superadmin:'Superadmin'};

  document.getElementById('user-role-label').textContent=roleLabels[STATE.role]||'';
  document.getElementById('user-avatar').textContent=roleLabels[STATE.role][0]||'U';

  // Menu items
  const items=MENU_ITEMS[STATE.role]||[];
  let viewToIdx={};
  let menuIdx=0;
  let html='';
  for(const item of items){
    if(item.section){html+=`<div class="menu-section">${item.section}</div>`;continue;}
    const isActive=STATE.view===item.view;
    const badge=item.badge?`<span class="menu-badge">${item.badge}</span>`:'';
    html+=`<button class="menu-btn${isActive?' is-active':''}" onclick="selectMenu(${menuIdx})">`+
      `<span class="menu-icon">${item.icon}</span>`+
      `<span class="menu-label">${item.label}</span>${badge}</button>`;
    viewToIdx[item.view]=menuIdx;
    menuIdx++;
  }
  // Set all menu containers to same (we use one unified container)
  const container=document.getElementById('sidebar-menu');
  container.innerHTML=html;

  // Notifications dot
  const unread=loadDB().notifications.filter(n=>!n.read&&n.roles.includes(STATE.role)).length;
  document.getElementById('notif-dot').style.display=unread>0?'block':'none';
}

function renderNotifPanel(){

  document.getElementById('notif-list').innerHTML=notifs.map(n=>`
    <div class="notif-item" style="${n.read?'opacity:.6':''}">
      <div class="notif-dot-big" style="background:${n.read?'#E4E4E7':'#2563EB'}"></div>
      <div>
        <div class="notif-text">${n.text}</div>
        <div class="notif-time">${timeAgo(n.ts)}</div>

    </div>`).join('');
}
function markAllRead(){

  saveDB(db);renderNotifPanel();document.getElementById('notif-dot').style.display='none';
}

});

function initSmartTimers(){
  const db=loadDB();
  db.smartTimers.forEach(t=>{
    if(t.alertFired||t.dismissed)return;
    const remaining=t.alertAfter-(Date.now()-t.startedAt);
    if(remaining<=0)fireSmartAlert(t.driverId);
    else setTimeout(()=>fireSmartAlert(t.driverId),remaining);
  });
}
function fireSmartAlert(driverId){
  const db=loadDB();
  const d=db.drivers.find(x=>x.id===driverId);
  if(!d||d.smartMatchDismissed)return;
  d.smartMatchAlert=true;
  const timer=db.smartTimers.find(t=>t.driverId===driverId);
  if(timer)timer.alertFired=true;
  const matches=db.freightListings.filter(l=>d.currentTrip&&l.from===d.currentTrip.to&&l.status==='open');
  const msg=matches.length>0?`🟡 ${d.name} — ${matches.length} ta mos qaytish yuki!`:`🟡 ${d.name} — qaytish yuki qidiring`;
  db.notifications.unshift({id:genId(),roles:['dispatcher','manager'],text:msg,ts:Date.now(),read:false});
  saveDB(db);
  document.getElementById('notif-dot').style.display='block';
  if(STATE.view==='drivers'||STATE.view==='dash')renderContent();
  toast('🟡 Smart Match: '+d.name);
}
function dismissSmartMatch(driverId){
  const db=loadDB();
  const t=db.smartTimers.find(t=>t.driverId===driverId);if(t)t.dismissed=true;
  const d=db.drivers.find(x=>x.id===driverId);
  if(d){d.smartMatchAlert=false;d.smartMatchDismissed=true;}
  saveDB(db);renderContent();toast('Smart Match yopildi');
}
function assignReturnLoad(driverId,listingId){
  const db=loadDB();
  const t=db.smartTimers.find(x=>x.driverId===driverId);if(t){t.dismissed=true;t.alertFired=true;}
  const d=db.drivers.find(x=>x.id===driverId);
  if(d){d.smartMatchAlert=false;d.smartMatchDismissed=true;}
  const l=db.freightListings.find(x=>x.id===listingId);
  if(l){l.status='matched';l.matchedDriverId=driverId;}
  saveDB(db);renderContent();closeModal('order-modal');toast('✅ Qaytish yuki biriktirildi!');
}

// ═══════════════════════════════════════════════════════
function renderDriverCard(d,db,compact=false){
  const pct=tripProgress(d);
  const matches=d.currentTrip&&d.smartMatchAlert?db.freightListings.filter(l=>l.from===d.currentTrip.to&&l.status==='open'):[];
  const alertClass=d.smartMatchAlert?' smart-alert':'';
  let tripHtml='';
  if(d.currentTrip){
    tripHtml=`<div class="driver-trip-info">
      <div class="driver-trip-route">📍 ${d.currentTrip.from} → ${d.currentTrip.to}</div>
      <div class="text-xs text-secondary" style="margin-top:2px">${d.currentTrip.estimatedHours}h yo'l • ${pct}% bajarildi</div>
      <div class="trip-bar" style="margin-top:6px"><div class="trip-bar-fill" style="width:${pct}%;background:${d.smartMatchAlert?'#F59E0B':'#2563EB'}"></div></div>
    </div>`;
  }
  let matchHtml='';
  if(d.smartMatchAlert){
    if(matches.length>0){
      matchHtml=`<div class="smart-match-section">
        <div class="smart-match-title">🔁 Qaytish yuklari (${matches.length} ta mos)</div>
        ${matches.map(l=>`
          <div class="match-listing" onclick="assignReturnLoad('${d.id}','${l.id}')">
            <div>
              <div class="match-listing-route">${l.from} → ${l.to}</div>
              <div class="match-listing-cargo">${l.cargo} • ${l.weight}t</div>
            </div>
            <div class="match-listing-price">${fmoney(l.price)}</div>
          </div>`).join('')}
        <div class="smart-match-actions">
          <button class="sm-btn sm-btn-dismiss" onclick="dismissSmartMatch('${d.id}')">Keyinga qoldirish</button>
        </div>
      </div>`;
    } else {
      matchHtml=`<div class="smart-match-section">
        <div class="smart-match-title">🔁 Qaytish yuki qidiring</div>
        <div class="text-xs text-secondary" style="margin-bottom:8px">${d.currentTrip?.to} → ${d.currentTrip?.from} yo'nalishi bo'yicha yuk toping</div>
        <div class="smart-match-actions">
          <button class="sm-btn sm-btn-dismiss" onclick="dismissSmartMatch('${d.id}')">Keyinga qoldirish</button>
        </div>
      </div>`;
    }
  }
  const v=db.vehicles.find(x=>x.id===d.vehicleId);
  return`<div class="driver-card${alertClass}" onclick="openDriverModal('${d.id}')">
    <div class="driver-card-top">
      <div class="driver-avatar" style="background:${d.smartMatchAlert?'#FEF3C7':'#F3F4F6'}">${d.name[0]}</div>
      <div class="driver-info">
        <div class="driver-name">${d.name} ${d.smartMatchAlert?'<span style="color:#D97706">🟡</span>':''}</div>
        <div class="driver-phone">${d.phone}</div>
        <div class="driver-status-row">
          <div class="status-dot ${d.status==='free'?'free':d.smartMatchAlert?'yellow':'on-trip'}"></div>
          <span class="text-xs text-secondary">${d.status==='free'?"Bo'sh":d.smartMatchAlert?'Qaytish yuki kerak':'Yo\'lda'} • ${carLabel(d.carType)} ${v?'• '+v.plateNumber:''}</span>
        </div>
      </div>
      <div class="text-xs text-secondary">⭐ ${d.rating}</div>
    </div>
    ${tripHtml}${matchHtml}
  </div>`;
}

      <div class="text-xs text-secondary mb-2 fw-700 mt-3" style="text-transform:uppercase;letter-spacing:.5px">Transport hujjatlari</div>
      ${v?vehicleDocs.map(doc=>`
        <div class="doc-item">
          <span style="font-size:16px">${docIcon(v.docs[doc.key]?.expiry)}</span>
          <div style="flex:1">
            <div class="doc-name">${doc.label}</div>

function switchDriverTab(tab){
  ['info','docs','vehicle','history'].forEach(t=>{
    document.getElementById('driver-tab-'+t).style.display=t===tab?'block':'none';
  });
  document.querySelectorAll('#driver-modal-tabs .tab').forEach((btn,i)=>{
    btn.classList.toggle('active',['info','docs','vehicle','history'][i]===tab);
  });
}

function openTripModal(driverId){
  STATE.tripModalDriverId=driverId;
  const db=loadDB();
  const d=db.drivers.find(x=>x.id===driverId);
  const cityOpts=CITIES.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('trip-modal-body').innerHTML=`
    <div class="form-group">
      <label class="form-label">Haydovchi</label>
      <div style="font-size:14px;font-weight:600;padding:8px;background:#F9FAFB;border-radius:8px">${d?.name||''}</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Qayerdan</label>
        <select class="form-input form-select" id="trip-from" onchange="updateTripCalc()">${cityOpts}</select>
      </div>
      <div class="form-group">
        <label class="form-label">Qayerga</label>
        <select class="form-input form-select" id="trip-to" onchange="updateTripCalc()">${cityOpts}</select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Yuk og'irligi (tonna)</label>
      <input class="form-input" type="number" id="trip-weight" value="10" min="1" max="25" onchange="updateTripCalc()">
    </div>
    <div style="background:#F9FAFB;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px">
      <div class="text-xs text-secondary mb-2">Hisob-kitob</div>
      <div class="flex justify-between mb-2">
        <span class="text-sm">Taxminiy yo'l vaqti:</span>
        <span class="text-sm fw-700" id="calc-hours">— soat</span>
      </div>
      <div class="flex justify-between">
        <span class="text-sm">Taxminiy narx:</span>
        <span class="text-sm fw-700" id="calc-price">—</span>
      </div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary w-full" onclick="startTrip()">🚀 Qatnovni boshlash</button>
      <button class="btn btn-secondary" onclick="closeModal('trip-modal')">Bekor</button>
    </div>`;
  updateTripCalc();
  closeModal('driver-modal');
  openModal('trip-modal');
}
function updateTripCalc(){
  const from=document.getElementById('trip-from')?.value;
  const to=document.getElementById('trip-to')?.value;
  const w=parseFloat(document.getElementById('trip-weight')?.value)||10;
  if(!from||!to)return;
  const hrs=calcHours(from,to);
  const db=loadDB();
  const d=db.drivers.find(x=>x.id===STATE.tripModalDriverId);
  const price=calcPrice(from,to,w,d?.carType||'fura');
  const hEl=document.getElementById('calc-hours');
  const pEl=document.getElementById('calc-price');
  if(hEl)hEl.textContent=hrs+' soat';
  if(pEl)pEl.textContent=fmoney(price);
}
function startTrip(){
  const from=document.getElementById('trip-from').value;
  const to=document.getElementById('trip-to').value;
  const w=parseFloat(document.getElementById('trip-weight').value)||10;
  const driverId=STATE.tripModalDriverId;
  const db=loadDB();
  const d=db.drivers.find(x=>x.id===driverId);
  if(!d)return;
  const hrs=calcHours(from,to);
  d.status='on-trip';
  d.currentTrip={from,to,startedAt:Date.now(),estimatedHours:hrs};
  d.smartMatchAlert=false;d.smartMatchDismissed=false;
  db.smartTimers=db.smartTimers.filter(t=>t.driverId!==driverId);
  const alertMs=hrs*0.9*3600000;
  db.smartTimers.push({driverId,startedAt:Date.now(),alertAfter:alertMs,alertFired:false,dismissed:false});
  saveDB(db);
  setTimeout(()=>fireSmartAlert(driverId),alertMs);
  closeModal('trip-modal');
  toast(`✅ Qatnov boshlandi: ${from} → ${to} (${hrs}h)`);
  renderContent();
}

function addContactLog(orderId){

  document.getElementById('log-text').value='';
  switchOrderTab('log'); // re-render would need modal re-open; show toast

}

function openNewOrderModal(){

  const freeDrivers=db.drivers.filter(d=>d.status==='free');
  const cityOpts=CITIES.map(c=>`<option>${c}</option>`).join('');

      <div class="form-group">
        <label class="form-label">Transport turi</label>
        <select class="form-input form-select" id="no-cartype" onchange="updateOrderCalc()">
          ${CAR_TYPES.map(c=>`<option value="${c.v}">${c.l}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Haydovchi</label>
        <select class="form-input form-select" id="no-driver">
          <option value="">Tayinlanmagan</option>
          ${driverOpts}
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Mijoz ismi</label>
        <input class="form-input" id="no-customer">
      </div>
      <div class="form-group">
        <label class="form-label">Mijoz telefoni</label>
        <input class="form-input" id="no-phone" placeholder="+998">
      </div>
    </div>
    <div style="background:#F9FAFB;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px">
      <div class="flex justify-between">
        <span class="text-sm">Taxminiy narx:</span>
        <span class="text-sm fw-700" id="no-price-calc">—</span>
      </div>
    </div>
    <div class="flex gap-2">
      <button class="btn btn-primary w-full" onclick="createOrder()">✅ Buyurtma yaratish</button>
      <button class="btn btn-secondary" onclick="closeModal('new-order-modal')">Bekor</button>
    </div>`;
  updateOrderCalc();
  openModal('new-order-modal');
}
function updateOrderCalc(){
  const from=document.getElementById('no-from')?.value;
  const to=document.getElementById('no-to')?.value;
  const w=parseFloat(document.getElementById('no-weight')?.value)||10;
  const ct=document.getElementById('no-cartype')?.value||'fura';
  if(!from||!to)return;
  const p=calcPrice(from,to,w,ct);
  const el=document.getElementById('no-price-calc');
  if(el)el.textContent=fmoney(p);
}
function createOrder(){
  const from=document.getElementById('no-from').value;
  const to=document.getElementById('no-to').value;
  const cargo=document.getElementById('no-cargo').value||'Noma\'lum yuk';
  const weight=parseFloat(document.getElementById('no-weight').value)||10;
  const carType=document.getElementById('no-cartype').value;
  const driverId=document.getElementById('no-driver').value||null;
  const customer={name:document.getElementById('no-customer').value||'Mijoz',phone:document.getElementById('no-phone').value||''};
  const price=calcPrice(from,to,weight,carType);
  const db=loadDB();
  const ord={id:genId(),from,to,cargo,weight,carType,status:driverId?'on-road':'pending',driverId,dispatcherId:'disp1',customer,price,createdAt:Date.now(),deliveredAt:null,contactLog:[],images:[],attachedDocs:[],borderCrossings:[]};
  db.orders.unshift(ord);
  if(driverId){
    const d=db.drivers.find(x=>x.id===driverId);
    if(d&&d.status==='free'){
      d.status='on-trip';
      d.currentTrip={orderId:ord.id,from,to,startedAt:Date.now(),estimatedHours:calcHours(from,to)};
    }
  }
  saveDB(db);closeModal('new-order-modal');
  toast('✅ Buyurtma yaratildi!');renderContent();
}

// ═══════════════════════════════════════════════════════
// DOC UPLOAD
// ═══════════════════════════════════════════════════════
let _uploadCtx={};
function uploadDoc(type,id,key){
  _uploadCtx={type,id,key};
  document.getElementById('doc-file-input').click();
}
document.getElementById('doc-file-input').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const url=await compressImg(file);
  const db=loadDB();
  if(_uploadCtx.type==='driver'){
    const d=db.drivers.find(x=>x.id===_uploadCtx.id);
    if(d&&d.docs[_uploadCtx.key])d.docs[_uploadCtx.key].dataUrl=url;
  }else if(_uploadCtx.type==='vehicle'){
    const v=db.vehicles.find(x=>x.id===_uploadCtx.id);
    if(v&&v.docs[_uploadCtx.key])v.docs[_uploadCtx.key].dataUrl=url;
  }
  saveDB(db);toast('📎 Hujjat yuklandi!');
  e.target.value='';
});
document.getElementById('logo-file-input').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const url=await compressImg(file,200,0.8);
  const db=loadDB();db.company.logoDataUrl=url;saveDB(db);
  document.getElementById('logo-img').innerHTML=`<img src="${url}" alt="logo">`;
  toast('Logo yangilandi!');e.target.value='';
});
function compressImg(file,maxSide=800,q=0.65){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        canvas.width=Math.round(img.width*scale);
        canvas.height=Math.round(img.height*scale);
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        res(canvas.toDataURL('image/webp',q));
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}

  db.company.name=document.getElementById('set-company-name').value||db.company.name;
  saveDB(db);renderSidebar();toast('✅ Sozlamalar saqlandi!');
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
(function init(){
  document.getElementById('role-select').value=STATE.role;
  renderAll();
  initSmartTimers();
  // BroadcastChannel — boshqa tabdan yangilanishni kuzatish
  try{
    const bc=new BroadcastChannel('karvandor');
    bc.addEventListener('message',()=>{renderContent();renderSidebar();});
  }catch{}
  // Network status
  window.addEventListener('online',()=>{document.getElementById('network-btn').textContent='🟢';});
  window.addEventListener('offline',()=>{document.getElementById('network-btn').textContent='🔴';});
  document.getElementById('network-btn').textContent=navigator.onLine?'🟢':'🔴';
})();
</script>
